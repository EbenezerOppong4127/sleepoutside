<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Outside | Checkout</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    /* Basic Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      background-color: #f7f7f7;
    }

    /* Checkout Form Section */
    .checkout-form {
      width: 90%;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    /* Fieldset Styling */
    fieldset {
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 20px;
      padding: 20px;
    }

    /* Legend Styling */
    legend {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 10px;
    }

    /* Input and Label Styling */
    label {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 5px;
      display: block;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
    }

    /* Checkout Button Styling */
    #checkoutSubmit {
      background-color: #28a745;
      color: #fff;
      padding: 15px;
      font-size: 1rem;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      text-transform: uppercase;
    }

    #checkoutSubmit:hover {
      background-color: #218838;
    }

    /* Order Summary Styling */
    .checkout-summary ul {
      list-style: none;
      padding-left: 0;
    }

    .checkout-summary li {
      margin-bottom: 15px;
    }

    .checkout-summary label {
      display: block;
      font-weight: 600;
    }

    .checkout-summary p {
      font-size: 1rem;
      color: #555;
    }

    /* Responsive Styling */
    @media (min-width: 768px) {
      .checkout__name,
      .checkout__address {
        display: flex;
        gap: 20px;
      }

      .checkout__name label,
      .checkout__name input,
      .checkout__address label,
      .checkout__address input {
        flex: 1;
      }

      input {
        width: 100%;
      }
    }

  </style>
  <script src="../js/checkout.js" type="module"></script>
</head>
<body>
<header class="divider" id="main-header"></header>
<main class="divider checkout">
  <h2>Review & Place your Order</h2>
  <section class="checkout-form">
    <form name="checkout">
      <fieldset>
        <legend>Shipping</legend>
        <div class="checkout__name">
          <label for="fname">First Name</label>
          <input name="fname" required />
          <label for="lname">Last Name</label>
          <input name="lname" required />
        </div>
        <div class="checkout__address">
          <label for="street">Street</label>
          <input name="street" required />
          <label for="city">City</label>
          <input name="city" required />
          <label for="state">State</label>
          <input name="state" required />
          <label for="zip">Zip</label>
          <input name="zip" id="zip" required />
        </div>
      </fieldset>
      <fieldset>
        <legend>Payment</legend>
        <label for="cardNumber">Card number</label>
        <input name="cardNumber" required />
        <label for="expiration">Expiration</label>
        <input name="expiration" required />
        <label for="code">Security Code</label>
        <input name="code" required />
      </fieldset>
      <fieldset class="checkout-summary">
        <legend>Order Summary</legend>
        <ul>
          <li>
            <label for="cartTotal"
            >Item Subtotal(<span id="num-items"></span>)</label
            >
            <p name="cartTotal" id="cartTotal"></p>
          </li>
          <li>
            <label for="shipping">Shipping Estimate</label>
            <p id="shipping"></p>
          </li>
          <li>
            <label for="tax">Tax</label>
            <p id="tax"></p>
          </li>
          <li>
            <label for="orderTotal"><b>Order Total</b></label>
            <p id="orderTotal"></p>
          </li>
        </ul>
      </fieldset>

      <button id="checkoutSubmit" type="submit">Checkout</button>
    </form>
  </section>
</main>
<footer id="main-footer"></footer>
</body>
</html>
