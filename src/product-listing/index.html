<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sleep Outside | Home</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.8);
    }

    .modal-content {
      background-color: #fefefe;
      margin: 5% auto;
      padding: 20px;
      border: 1px solid #888;
      width: 80%;
      max-width: 700px;
      position: relative;
    }

    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
    }

    .close:hover,
    .close:focus {
      color: black;
      text-decoration: none;
      cursor: pointer;
    }

    /* Carousel Styling */
    .carousel {
      position: relative;
      width: 100%;
      overflow: hidden;
      margin: 20px 0;
    }

    .carousel-container {
      display: flex;
      overflow: hidden;
      scroll-behavior: smooth;
      width: 100%;
    }

    .carousel-track {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }

    .carousel-item {
      min-width: 100px;
      max-width: 100%;
      margin-right: 10px;
    }

    .carousel-item img {
      display: block;
      width: 100%;
      height: auto;
    }

    .carousel-control {
      position: absolute;
      top: 50%;
      background-color: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      font-size: 24px;
      padding: 10px;
      cursor: pointer;
      transform: translateY(-50%);
      z-index: 1;
    }

    .carousel-control.prev {
      left: 10px;
    }

    .carousel-control.next {
      right: 10px;
    }

    /* Responsive Design */
    @media screen and (max-width: 768px) {
      .modal-content {
        width: 90%;
        padding: 10px;
      }

      .carousel-item {
        min-width: 70px;
      }

      .carousel-control {
        font-size: 20px;
        padding: 5px;
      }
    }

    @media screen and (max-width: 480px) {
      .carousel-item {
        min-width: 50px;
      }

      .carousel-control {
        font-size: 18px;
      }
    }

  </style>
</head>
<body>
<header class="divider" id="main-header"></header>
<main class="divider">
  <div class="hero">
    <img
      src="/images/banner-sm.jpg"
      srcset="images/banner-sm.jpg 500w, images/banner.jpg"
      alt="image of a high mountain lake"
    />
    <div class="logo logo--square">
      <img src="/images/noun_Tent_2517.svg" alt="tent image for logo">
      <div>Sleep<span class="highlight">Outside</span></div>
    </div>
  </div>
  <section class="mission">
    <p>We spend too much time these days indoors...sitting usually.</p>
    <p>No wonder we are a mess!</p>
    <p>
      What we really need is to get outside...in fact SLEEP outside. Our
      mission is to provide you with everything you need to do this
      comfortably at an affordable price.
    </p>
  </section>
  <section class="products">
    <h2>Top Products</h2>
    <nav>
      <form id="search-form">
        <input type="text" id="search-input" placeholder="Search for products..." />
        <button type="submit">Search</button>
      </form>
    </nav>

    <div>
      <label for="sort">Sort by:</label>
      <select id="sort">
        <option value="name">Name</option>
        <option value="price">Price</option>
      </select>
    </div>


    <!-- Use only one product-list element -->
    <ul class="product-list">
      <!-- Product items will be dynamically added here -->
    </ul>
  </section>
  <!-- Modal for Quick View -->
  <!-- Modal structure -->
  <div id="productModal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close">&times;</span>
      <div id="modalProductDetails"></div>
    </div>
  </div>


</main>
<footer id="main-footer"></footer>
<script src="../js/product-listing.js" type="module"></script>
</body>
</html>
